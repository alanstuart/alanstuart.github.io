<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate to Our Cause</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .container {
            background-color: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .donation-methods {
            list-style-type: none;
            padding: 0;
        }
        .donation-methods li {
            display: flex;
            align-items: center;
            background-color: #ecf0f1;
            margin: 10px 0;
            padding: 15px;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.3s;
        }
        .donation-methods li:hover {
            background-color: #3498db;
            color: white;
            transform: scale(1.05);
        }
        .donation-methods li img {
            width: 24px;
            height: 24px;
            margin-right: 10px;
        }
        .contact {
            margin-top: 20px;
            font-style: italic;
        }
        form {
            margin-top: 20px;
        }
        form input, form textarea, form button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        form button {
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }
        form button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Donate to Our Cause</h1>
        <p>Your support makes a difference. We accept donations through the following methods:</p>
        <ul class="donation-methods">
            <li>
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg" alt="PayPal Logo">
                <a href="https://www.paypal.com/donate" target="_blank">PayPal</a>
            </li>
            <li>
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/47/Credit_card_logo.png" alt="Credit Card Icon">
                <a href="https://example.com/credit-card" target="_blank">Credit Card</a>
            </li>
            <li>
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/46/Bitcoin.svg" alt="Cryptocurrency Icon">
                <a href="https://example.com/crypto" target="_blank">Cryptocurrency</a>
            </li>
        </ul>
        <p class="contact">To make a donation, please fill out the form below or contact us at: <a href="mailto:donatetoalan@example.com">donatetoalan@example.com</a></p>

        <!-- Contact Form -->
        <form action="https://formspree.io/f/your-form-id" method="POST">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" rows="4" placeholder="Your Message"></textarea>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
