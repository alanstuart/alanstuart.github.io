<svg width="32" height="32" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favicon-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <filter id="favicon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#222" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- 3D "A" y "H" combinados en un monograma más compacto -->
  <g filter="url(#favicon-shadow)" transform="scale(0.95) translate(5,5)">
    <!-- "A" simplificado -->
    <polygon points="25,80 40,20 55,80 48,80 40,45 32,80" fill="url(#favicon-gradient)" />
    <!-- "H" simplificado -->
    <rect x="65" y="30" width="8" height="50" fill="url(#favicon-gradient)" />
    <rect x="85" y="30" width="8" height="50" fill="url(#favicon-gradient)" />
    <rect x="65" y="55" width="28" height="8" fill="url(#favicon-gradient)" />
  </g>
</svg>
